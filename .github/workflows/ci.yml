name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-build:
    name: Verify & build (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run quality gates (npm run verify)
        run: npm run verify

      - name: Production build (npm run build)
        run: npm run build
