name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify & build (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run quality gates (npm run verify)
        run: npm run verify

      - name: Production build (npm run build)
        run: npm run build
        env:
          # Public build-time placeholders: protected pages render during
          # `next build`, and require NEXT_PUBLIC_* values to exist. They are
          # not secrets; real values come from the deployment environment.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Secret scan
        run: npm run secret:scan

      - name: Production dependency audit policy
        run: npm audit --omit=dev --audit-level=high

  e2e-and-a11y:
    name: E2E & accessibility (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify-and-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (core, alternative, two-user, accessibility)
        run: npx playwright test
        env:
          # The Playwright web servers start their own local tinbase backend
          # and production Next server; nothing here uses production secrets.
          CI: "1"

      - name: Check Playwright clean results (no flaky/retry)
        run: node scripts/check-playwright-results.mjs test-results/playwright-results.json

      - name: Run Playwright AI-failure fallback (dev server)
        run: npx playwright test --config=playwright.ai-failure.config.ts
        env:
          CI: "1"

      - name: Check AI-failure Playwright clean results (no flaky/retry)
        run: node scripts/check-playwright-results.mjs test-results/playwright-ai-failure-results.json

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
